[workspace]
resolver = "2"
members = [
    "crates/greed-kernel",
    "crates/greed-strategy",
    "crates/greed-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wonder/greed"

[workspace.dependencies]
greed-kernel = { path = "crates/greed-kernel" }
greed-strategy = { path = "crates/greed-strategy" }

tokio = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow    = "1"
toml      = "0.8"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
zip      = { version = "2", default-features = false, features = ["deflate"] }
chrono   = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
