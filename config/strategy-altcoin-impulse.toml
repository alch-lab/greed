# 山寨币高周转截面动量（独立高风险 sleeve）
# 每 3 小时根据已闭合 15m K 线重建全市场 12h 截面：市场中位涨幅达到 1%
# 做多最强的 5 个币，否则做空最弱的 5 个币。组合总名义额度在五条腿间等权分配。

[altcoin_impulse]
enabled = true
capital_usdt = 1000.0
exchange_leverage = 10
# 标的不支持 10x 时自动回退，最低接受 5x；再低会因保证金占用过高而跳过。
min_exchange_leverage = 5
risk_per_trade = 0.04
# 六日分钟级双窗口验证：多单约 2.0x 权益，给第二候选预留组合容量；
# 空单样本较少但贡献更高，暂保留约 2.5x。两者仍受 max_gross_multiple 硬限制。
long_risk_scale = 0.75
short_risk_scale = 1.0
# 顺向拥挤保护：做多时检查正资金费率/正溢价，做空时镜像检查负值。
# ACEUSDT 复盘中的 -0.997% 资金费率与 -1.26% 永续折价会被该门槛拦截。
max_directional_funding_rate = 0.003
max_directional_premium = 0.010
max_positions = 5
# 0 表示不限制北京时间自然日内的开仓次数；仍受日回撤、仓位槽、冷却与流动性约束。
max_daily_entries = 0
# 每日开仓已无限，不需要临时加额。
max_daily_entry_bonus = 0
daily_loss_limit = 0.04
max_gross_multiple = 0.50
# 模拟盘持续运行，不设盈利上限，也不因首个 7 天窗口结束而停止开仓。
# 下面的 7 天窗口只用于首周亏损保护。
first_week_duration_days = 7
# 首周累计权益回撤达到 12% 时锁死新开仓；已有仓位继续由保护单管理。
first_week_loss_limit = 0.12
# dry 模式每次开/平仓各施加 5bp 不利滑点；手续费仍按单边 5bp 另计。
dry_slippage_bps = 5.0

stop_pct = 0.010
# 每仓立即挂 1% STOP_MARKET；达到 +1.5% 先兑现 33%，剩余仓位按峰值回撤 0.5% 保护。
loss_trim_trigger_pct = 0.01
loss_trim_fraction = 0.50
loss_trim_enabled = false
# 仓位预算额外计入 0.5% 执行成本；STOP_MARKET 极端跳空仍无法保证绝对封顶。
risk_execution_buffer_pct = 0.005
trail_activation_pct = 0.015
trail_pct = 0.005
partial_take_profit_fraction = 0.33
failed_breakout_window_minutes = 15
failed_breakout_adverse_pct = 0.03
failed_breakout_max_mfe_pct = 0.005
failed_breakout_enabled = false
recovery_lock_adverse_pct = 0.03
recovery_lock_activation_pct = 0.01
recovery_lock_pct = 0.0025
recovery_lock_enabled = false
max_hold_hours = 2
cooldown_hours = 4
# 信号价到实际可成交价最多允许 1.5% 不利偏移；超出则 IOC 限价单不追。
max_entry_slippage_pct = 0.015
# 只成交刚闭合的确认信号，避免仓位释放后追逐旧 K 线。
max_signal_age_seconds = 300
# 突破后等待回踩/反抽守住，再由后续独立 K 线顺向收回。
direct_entry_enabled = false
fixed_time_exit_only = false
confirmation_window_bars = 4
retest_touch_pct = 0.01
retest_invalidation_pct = 0.015
reclaim_pct = 0.002
# 信号 K 已越过旧 24h 边界 3.5% 以上时，旧边界会变成过深且失真的
# 回踩锚点。此时改用信号收盘价观察浅回踩；仍必须由下一根独立 15m K
# 顺向收回，不允许在放量大阳/大阴线闭合后直接追单。
adaptive_retest_enabled = true
vertical_overshoot_pct = 0.035
vertical_retest_touch_pct = 0.005
vertical_retest_invalidation_pct = 0.015
vertical_reclaim_pct = 0.002
# 即使已经浅回踩，确认收盘距离信号锚点超过 2% 也不追第二段垂直拉升。
vertical_max_entry_extension_pct = 0.02
# 垂直脉冲候选每约 5 秒读取一次实时 markPrice：必须先观察到浅回踩，
# 后续另一次采样从盘中极值反弹至少 0.3%，才可转交流动性与风控执行门槛。
intrabar_vertical_retest_enabled = true
intrabar_min_pullback_pct = 0.003
intrabar_rebound_pct = 0.003
# 旧极端延续分支关闭。
extreme_direct_enabled = false
extreme_direct_return_1h = 0.18
extreme_direct_return_4h = 0.25
extreme_direct_volume_ratio = 6.0
extreme_direct_risk_scale = 0.33

# 独立小仓杠杆衰竭做空：极端上涨脉冲后，只观察紧随其后的第一根 15m K。
# 第一阶段只使用自身的 1h 涨幅和量比，不继承主策略的24h突破、4h区间、
# 路径效率、收盘位置或回踩确认；币种池、数据时效、流动性和账户风控仍共享。
# 八日因果分钟回放显示，25% OI / 4.5% 回落确认过晚。这里恢复到相邻参数
# 也保持为正的 20% OI / 3.5% 回落，同时保留现货滞后和真实可成交性硬门槛。
# 仅 paper/dry 启用；它拥有独立的 1 个仓位槽和 1.0x 权益名义额度。
pulse_exhaustion_enabled = true
pulse_exhaustion_allow_live = false
pulse_initial_return_1h = 0.06
pulse_initial_volume_ratio = 10.0
pulse_perp_return_1h = 0.06
pulse_oi_change_1h = 0.20
pulse_max_spot_perp_ratio = 1.10
pulse_min_peak_retrace = 0.035
pulse_max_close_location = 0.80
# 2% 止损 + 0.5% 执行缓冲下，0.625 风险倍率对应约 1.0x 权益名义仓位。
pulse_risk_scale = 0.625
pulse_max_positions = 1
pulse_max_gross_multiple = 1.00
# 杠杆衰竭需要容纳反抽噪声，独立使用 2% 硬止损；到 +2% 兑现 33%，
# 余仓按峰值回撤 0.75% 跟踪。主突破通道仍保持 1% / 1.5% / 0.5%。
pulse_stop_pct = 0.020
pulse_trail_activation_pct = 0.020
pulse_trail_pct = 0.0075
# 只给衰竭空单略放宽永续折价：主通道仍保持 1.0%，资金费门槛不变。
pulse_max_directional_premium = 0.015

min_24h_volume_usd = 5000000.0
# 只扫描同名现货 + USDT 永续的山寨币；排除 BTC/ETH/BNB/SOL/XRP 及另外六个主流币，
# 同时排除刚上市不足 7 天的永续、盘前和指数。
min_contract_age_days = 7
# 下单前在实际执行端点硬检验可成交性；主网信号再强，也不能绕过这些门槛。
max_spread_bps = 10.0
# 普通盘口仍限制 10bps；只有双边深度达到基础要求 3 倍、进出冲击低于各自
# 上限一半、60 秒成交笔数达到基础要求 2 倍且成交新鲜时，才允许到 15bps。
liquid_market_max_spread_bps = 15.0
max_entry_impact_bps = 15.0
max_exit_impact_bps = 20.0
depth_band_pct = 0.005
min_depth_multiple = 10.0
recent_trade_window_seconds = 60
min_recent_trades = 30
min_unique_trade_prices = 8
# 价格档位数受 tick size 影响很大，只做观测告警，不单独否决下单。
unique_trade_prices_hard = false
max_last_trade_age_seconds = 5
min_return_1h = 0.04
max_return_1h = 0.30
# 过度延伸追多仍关闭，避免在脉冲末端接盘。
overextension_long_return_1h = 0.12
overextension_long_return_4h = 0.15
overextension_long_enabled = false
overextension_reentry_lookback_hours = 24
min_return_4h = 0.06
max_return_4h = 0.60
min_volume_ratio = 4.0
min_efficiency = 0.45
min_close_location = 0.70

# 先按当前活跃度筛选，再进行因果信号判断。
scan_limit = 120
poll_seconds = 60

# 高风险模块默认禁止主网实盘；paper/dry 不受影响。
allow_live = false

[altcoin_cross_section]
# 12h/3h 截面动量直接执行。全池 12h 中位涨幅达到 1% 时做多最强币，
# 其余市场状态做空最弱币；这是一条经过样本验证的偏空规则，并非只做空。
# 最近 30 个已完成信号 PF >= 1.30 且累计
# 收益为正时用 0.40x 权益；若候选相对全市场中位数还有至少 12% 超额动量，
# 再升到 0.50x。其余状态仍用 0.05x 小仓执行，不会停止交易。
enabled = true
formation_hours = 12
hold_hours = 3
names = 5
min_24h_volume_usd = 10000000.0
market_momentum_threshold = 0.01
gate_window = 30
gate_min_profit_factor = 1.30
# 影子门控按每边 5bp taker 手续费 + 5bp 不利滑点计成本。
assumed_cost_bps_per_side = 10.0
base_gross_multiple = 0.05
active_gross_multiple = 0.40
strong_excess_return = 0.12
strong_gross_multiple = 0.50
# 同币同向连续入选时保留原仓和已收紧的保护，不再每 3 小时平掉重开。
# 4% 初始止损将 0.5x 强信号仓的价格风险压到约 2% 权益；盈利达到 5%
# 兑现 33%，余仓按峰值回撤 2% 跟踪。3 小时只是重新排名边界。
# 完整止盈/止损后，从下一根闭合 15m K 开始提前重排；当前 3h 窗口内
# 已退出币不再重进，替代候选相对全池中位数须达到 strong_excess_return。
stop_pct = 0.04
trail_activation_pct = 0.05
trail_pct = 0.02
partial_take_profit_fraction = 0.33
