# 山寨币确认式放量突破（独立高风险 sleeve）
# 以 109e769 的攻击型主线为基准：24h 突破后必须经历回踩/反抽，随后由独立
# 15m K 线顺向收回才入场。保留后续版本的实时流动性、精度、杠杆回退和保护单修复。

[altcoin_impulse]
enabled = true
capital_usdt = 1000.0
exchange_leverage = 10
# 标的不支持 10x 时自动回退，最低接受 5x；再低会因保证金占用过高而跳过。
min_exchange_leverage = 5
risk_per_trade = 0.04
max_positions = 2
max_daily_entries = 10
# 模拟盘固定最多 10 笔/北京时间自然日，不允许临时加额。
max_daily_entry_bonus = 0
daily_loss_limit = 0.04
max_gross_multiple = 2.5
# 模拟盘持续运行，不设盈利上限，也不因首个 7 天窗口结束而停止开仓。
# 下面的 7 天窗口只用于首周亏损保护。
first_week_duration_days = 7
# 首周累计权益回撤达到 12% 时锁死新开仓；已有仓位继续由保护单管理。
first_week_loss_limit = 0.12
# dry 模式每次开/平仓各施加 5bp 不利滑点；手续费仍按单边 5bp 另计。
dry_slippage_bps = 5.0

stop_pct = 0.010
# 每仓立即挂 1% STOP_MARKET；达到 +1.5% 先兑现 33%，剩余仓位按峰值回撤 0.5% 保护。
loss_trim_trigger_pct = 0.01
loss_trim_fraction = 0.50
loss_trim_enabled = false
# 仓位预算额外计入 0.5% 执行成本；STOP_MARKET 极端跳空仍无法保证绝对封顶。
risk_execution_buffer_pct = 0.005
trail_activation_pct = 0.015
trail_pct = 0.005
partial_take_profit_fraction = 0.33
failed_breakout_window_minutes = 15
failed_breakout_adverse_pct = 0.03
failed_breakout_max_mfe_pct = 0.005
failed_breakout_enabled = false
recovery_lock_adverse_pct = 0.03
recovery_lock_activation_pct = 0.01
recovery_lock_pct = 0.0025
recovery_lock_enabled = false
max_hold_hours = 2
cooldown_hours = 4
# 信号价到实际可成交价最多允许 1.5% 不利偏移；超出则 IOC 限价单不追。
max_entry_slippage_pct = 0.015
# 只成交刚闭合的确认信号，避免仓位释放后追逐旧 K 线。
max_signal_age_seconds = 120
# 突破后等待回踩/反抽守住，再由后续独立 K 线顺向收回。
direct_entry_enabled = false
fixed_time_exit_only = false
confirmation_window_bars = 4
retest_touch_pct = 0.01
retest_invalidation_pct = 0.015
reclaim_pct = 0.002
# 旧极端延续分支关闭。
extreme_direct_enabled = false
extreme_direct_return_1h = 0.18
extreme_direct_return_4h = 0.25
extreme_direct_volume_ratio = 6.0
extreme_direct_risk_scale = 0.33

min_24h_volume_usd = 5000000.0
# 只扫描同名现货 + USDT 永续的山寨币；排除 BTC/ETH/BNB/SOL/XRP 及另外六个主流币，
# 同时排除刚上市不足 7 天的永续、盘前和指数。
min_contract_age_days = 7
# 下单前在实际执行端点硬检验可成交性；主网信号再强，也不能绕过这些门槛。
max_spread_bps = 10.0
max_entry_impact_bps = 15.0
max_exit_impact_bps = 20.0
depth_band_pct = 0.005
min_depth_multiple = 10.0
recent_trade_window_seconds = 60
min_recent_trades = 30
min_unique_trade_prices = 8
# 价格档位数受 tick size 影响很大，只做观测告警，不单独否决下单。
unique_trade_prices_hard = false
max_last_trade_age_seconds = 5
min_return_1h = 0.04
max_return_1h = 0.30
# 过度延伸追多仍关闭，避免在脉冲末端接盘。
overextension_long_return_1h = 0.12
overextension_long_return_4h = 0.15
overextension_long_enabled = false
overextension_reentry_lookback_hours = 24
min_return_4h = 0.06
max_return_4h = 0.60
min_volume_ratio = 4.0
min_efficiency = 0.45
min_close_location = 0.70

# 先按当前活跃度筛选，再进行因果信号判断。
scan_limit = 60
poll_seconds = 60

# 高风险模块默认禁止主网实盘；paper/dry 不受影响。
allow_live = false

[altcoin_cross_section]
# 横截面反转不占真实仓位；当前真实执行恢复确认式放量突破。
enabled = false
