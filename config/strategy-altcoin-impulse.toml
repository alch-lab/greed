# 山寨币放量突破（独立高风险 sleeve）
#
# 10x 仅是交易所保证金杠杆。仓位按风险预算 /（止损距离 + 执行缓冲）计算：
# 1000 USDT × 6% / (5% + 0.6%) ≈ 1071 USDT 名义仓位，约占 107 USDT 保证金。
# 0.6% 为止损滑点和开平仓费用预留，避免名义 6% 风险在成交后系统性超标。

[altcoin_impulse]
enabled = true
capital_usdt = 1000.0
exchange_leverage = 10
# 标的不支持 10x 时自动回退，最低接受 5x；再低会因保证金占用过高而跳过。
min_exchange_leverage = 5
risk_per_trade = 0.06
max_positions = 2
max_daily_entries = 6
# 手动按钮每次增加 2 笔，最多当日额外 4 笔：默认 6 笔可扩到 8/10 笔。
# 额外额度只扩大机会数，不绕过 4% 当日权益回撤和同币 4 小时冷却。
max_daily_entry_bonus = 4
daily_loss_limit = 0.04
max_gross_multiple = 4.0

stop_pct = 0.05
# 仓位预算额外计入 0.6% 执行成本；STOP_MARKET 极端跳空仍无法保证绝对封顶。
risk_execution_buffer_pct = 0.006
# 日志显示短促行情常在 +2%～+4% 后反转；达到 +2% 即开始按峰值回撤 1% 保护。
trail_activation_pct = 0.02
trail_pct = 0.01
# 首次达到 +2% 时市价兑现 50%，剩余仓位继续使用上述跟踪保护。
partial_take_profit_fraction = 0.50
# 纯价格路径保护：若持仓曾逆向达到 3%，随后修复到盈利 1%，
# 将保护抬到入场价顺向 0.25%；不依赖持仓时间。
recovery_lock_adverse_pct = 0.03
recovery_lock_activation_pct = 0.01
recovery_lock_pct = 0.0025
max_hold_hours = 6
cooldown_hours = 4
# 信号价到实际可成交价最多允许 1.5% 不利偏移；超出则 IOC 限价单不追。
max_entry_slippage_pct = 0.015
# 只成交刚闭合的突破信号；仓位释放后不追逐已运行数分钟的旧 K 线。
max_signal_age_seconds = 120

min_24h_volume_usd = 5000000.0
min_return_1h = 0.04
max_return_1h = 0.45
# 1h 涨幅达到 12% 或 4h 涨幅达到 15% 视为“过度延伸追多票”。历史上这类
# 交易并非永久负期望，因此保留第一枪；但同类票一旦当日亏损，熔断后续追多。
overextension_long_return_1h = 0.12
overextension_long_return_4h = 0.15
# 同币最近 24 小时已经平过仓时，不再于过度延伸区二次追涨；普通新启动仍可重入。
overextension_reentry_lookback_hours = 24
min_return_4h = 0.06
max_return_4h = 1.20
min_volume_ratio = 3.0
min_efficiency = 0.35
min_close_location = 0.60

# 先按当前 24h 活跃度选出扫描池，再用 7 天滚动基线做因果判断。
scan_limit = 60
poll_seconds = 60

# 高风险模块默认禁止主网实盘；paper/dry 不受影响。
allow_live = false

# 7 日强势币横截面反转：仅做前向影子观测，绝不向交易所下单。
# 每天 UTC 00:15（北京时间 08:15）对“同名现货 + USDT 永续”中等流动性币种
# 排名，虚拟做空前 5 名并记录 24h 路径。滚动门控只标记是否具备历史优势，
# 不会改变上面的放量突破策略，也不占用它的持仓或每日开仓额度。
[altcoin_reversal_observer]
enabled = true
shadow_capital_usdt = 1000.0
gross_multiple = 1.0
lookback_days = 7
top_n = 5
min_24h_volume_usd = 10000000.0
max_24h_volume_usd = 150000000.0
stop_pct = 0.08
hold_hours = 24
fee_bps_per_side = 5.0
slippage_bps_per_side = 5.0
gate_window = 20
gate_min_mean_return = 0.0
gate_min_profit_factor = 1.20
# 超过 00:15 后 5 分钟不再补做当日影子入场，防止使用事后价格。
entry_window_minutes = 5
