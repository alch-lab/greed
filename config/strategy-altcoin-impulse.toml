# 山寨币放量突破（独立高风险 sleeve）
#
# 10x 仅是交易所保证金杠杆。仓位按 risk_per_trade / stop_pct 计算：
# 1000 USDT × 10% / 5% = 2000 USDT 名义仓位，约占 200 USDT 保证金。
# 不允许把 1000 USDT 直接开成 10000 USDT；一次 5% 止损会损失约 50% 本金。

[altcoin_impulse]
enabled = true
capital_usdt = 1000.0
exchange_leverage = 10
risk_per_trade = 0.10
max_positions = 2
max_daily_entries = 6
daily_loss_limit = 0.04
max_gross_multiple = 4.0

stop_pct = 0.05
trail_activation_pct = 0.05
trail_pct = 0.03
max_hold_hours = 6
cooldown_hours = 8
# 信号价到实际可成交价最多允许 1.5% 不利偏移；超出则 IOC 限价单不追。
max_entry_slippage_pct = 0.015

min_24h_volume_usd = 5000000.0
min_return_1h = 0.04
max_return_1h = 0.45
min_return_4h = 0.06
max_return_4h = 1.20
min_volume_ratio = 3.0
min_efficiency = 0.35
min_close_location = 0.60

# 先按当前 24h 活跃度选出扫描池，再用 7 天滚动基线做因果判断。
scan_limit = 60
poll_seconds = 60

# 高风险模块默认禁止主网实盘；paper/dry 不受影响。
allow_live = false
