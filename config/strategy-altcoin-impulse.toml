# 山寨币放量突破（独立高风险 sleeve）
#
# 10x 仅是交易所保证金杠杆。仓位按 risk_per_trade / stop_pct 计算：
# 1000 USDT × 2% / 8% = 250 USDT 名义仓位，约占 25 USDT 保证金。
# 不允许把 1000 USDT 直接开成 10000 USDT；一次 8% 止损会损失约 80% 本金。

[altcoin_impulse]
enabled = true
capital_usdt = 1000.0
exchange_leverage = 10
risk_per_trade = 0.02
max_positions = 2
max_daily_entries = 4
daily_loss_limit = 0.04
max_gross_multiple = 1.25

stop_pct = 0.08
trail_activation_pct = 0.12
trail_pct = 0.10
max_hold_hours = 72
cooldown_hours = 24

min_24h_volume_usd = 5000000.0
min_return_1h = 0.06
max_return_1h = 0.20
min_return_4h = 0.10
max_return_4h = 0.45
min_volume_ratio = 5.0
min_efficiency = 0.40
min_close_location = 0.70

# 先按当前 24h 活跃度选出扫描池，再用 7 天滚动基线做因果判断。
scan_limit = 60
poll_seconds = 60

# 高风险模块默认禁止主网实盘；paper/dry 不受影响。
allow_live = false
