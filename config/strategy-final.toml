# 订单流力竭 v2：位置 → effort/result 吸收 → Delta 翻转。
# 直接使用 Binance 主网逐笔成交；若回放事件包含订单簿/OI，模型自动纳入观测。

[strategy]
name = "orderflow-exhaustion-v2"
signals = ["OrderFlowExhaustion"]
trigger = "OrderFlowEntry"
filters = ["CircuitBreaker"]
exits = ["OrderFlowTradeManagement"]

[strategy.plugins.OrderFlowExhaustion]
bucket_ms = 60000
baseline_buckets = 60
location_buckets = 90
min_baseline_buckets = 20
min_volume_ratio = 2.00
min_delta_share = 0.15
confirm_delta_share = 0.08
max_efficiency = 0.35
min_sweep_pct = 0.00050
min_vwap_deviation_pct = 0.0050
require_sweep = true
confirm_buckets = 3
second_entry_buckets = 10
cooldown_buckets = 30
stop_buffer_pct = 0.00035

[strategy.plugins.OrderFlowEntry]
trade_extreme = true
trade_confirmed = false
trade_second = false
extreme_risk_scale = 0.35
confirmed_risk_scale = 1.00
second_risk_scale = 0.50
tp1_r = 2.00
min_stop_pct = 0.0030
max_stop_pct = 0.0060
passive_entry = false

[strategy.plugins.OrderFlowTradeManagement]
tp1_close = 0.50
tp2_original_close = 0.25
tp2_r = 4.00
runner_trail_pct = 0.006
max_hold_hours = 4.0
