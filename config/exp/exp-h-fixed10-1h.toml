# 实验配置 exp-h-fixed10-1h（2026-07-28 第二轮：更低固定阈值；基线=strategy-final）
[strategy]
signals = ["DualTfMeanReversion"]
trigger = "PyramidMrFollow"
filters = ["CircuitBreaker"]
exits = ["TieredTakeProfit", "TimeStop"]

[strategy.plugins.DualTfMeanReversion]
fast_bar_ms = 300000
slow_bar_ms = 3600000
fast_ema_p = 20
slow_ema_p = 20
deviation_threshold = 0.010

[strategy.plugins.PyramidMrFollow]
sl_pct = 0.01
cooldown_ms = 1800000
add_step_pct = 0.0035
add_size_frac = 0.5
max_adds = 2

[strategy.plugins.TieredTakeProfit]
tp1_pct = 100

[strategy.plugins.TimeStop]
max_hours = 6.0

[strategy.plugins.CircuitBreaker]
max_daily_loss = 5
drawdown_pct = 8.0
