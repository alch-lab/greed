# 实验配置（T2 积极限价 limit_offset_pct=-0.0005；基线=strategy-final）
#
# 信号：DualTfMeanReversion（5m/1h 双时间框架，偏离 1.5%）
# 扳机：PyramidMrFollow（路径 D：价格每再偏离 0.35% 加 0.5 层，最多 3 层）
# 入场：首层在信号价原地挂限价单（limit_offset_pct=0，maker 2bps），加仓层仍市价
# 出场：TP = 5m EMA20 全平；SL = 入场价 1%（加仓不移动）；6h 时间止损
#
# 双期验证（$100K、0.75% 风险/笔、maker 2bps / taker 4bps + 滑点 1bps）：
#   2025 全年：18 笔 胜率 50.0%  +$3,670
#   2026 H1 ：14 笔 胜率 57.1%  +$4,449
# 建议运行风险档：--risk-pct 0.015 --max-risk-pct 0.015（回撤 ~1.5%）
# 详见 docs/STRATEGY_DOC.md 第 9.6 / 9.14 节。

[strategy]
signals = ["DualTfMeanReversion"]
trigger = "PyramidMrFollow"
filters = ["CircuitBreaker"]
exits = ["TieredTakeProfit", "TimeStop"]

[strategy.plugins.DualTfMeanReversion]
fast_bar_ms = 300000
slow_bar_ms = 3600000
fast_ema_p = 20
slow_ema_p = 20
deviation_threshold = 0.015

[strategy.plugins.PyramidMrFollow]
sl_pct = 0.01
cooldown_ms = 1800000
add_step_pct = 0.0035
add_size_frac = 0.5
max_adds = 2
# 首层限价入场：0 = 信号价原地挂单（maker）；<0 = 市价（旧行为）
limit_offset_pct = -0.0005

[strategy.plugins.TieredTakeProfit]
tp1_pct = 100

[strategy.plugins.TimeStop]
max_hours = 6.0

[strategy.plugins.CircuitBreaker]
max_daily_loss = 5
drawdown_pct = 8.0
