# 策略装配配置（PR-4 起生效；对应规则书 §5 参数表）
# 策略 = signals[] + filters[] + trigger + exits[] 的声明式组合。

[strategy]
signals = [
    # "ObiZones",         # Phase 2：色带 OBI（待采集数据）
    "AggDeltaTier",       # PR-9：总Delta阈值档位
    "RenkoBricks",        # PR-6: renko 砖（力竭反转扳机输入）
    "OiQuadrant",         # PR-9：OI 四象限
    "LargeTradeFlow",     # PR-8：AGGR 大单速率（力竭反转辅助）
]

trigger = "ExhaustionReversal"  # 力竭反转三条件

filters = [
    "TrendRegimeFilter",  # 单边禁反转
    # "InZoneFilter",     # Phase 2：只在色带区内扣扳机
    "SessionFilter",      # 时段过滤
    "EventCalendarFilter",# 宏观事件窗口禁开仓
    "CircuitBreaker",     # 日连损2次/回撤3% 熔断
]

exits = [
    "BreakevenAt300",     # 离开300美元推保本
    "TieredTakeProfit",   # TP1/TP2
    "TimeStop",           # 时间止损
]

# ---- 信号参数（对应规则书 §5，默认值锚定教程，校准只做单调微调）----

[strategy.plugins.RenkoBricks]
tick_usd = 0.5
t_ren_ticks = 200         # 同向 100 美元/砖
r_ren_ticks = 124         # 反向 62 美元出反转砖
brick_size_pct = 0.0005   # 0.05%
min_offset_pct = 0.00031  # 比例保持 0.62

[strategy.plugins.AggDeltaTier]
t1 = 1.0   # B USD
t2 = 2.0
t3 = 3.0
t4 = 3.5
window_hours = 24
r_trend = 2.0

[strategy.plugins.OiQuadrant]
oi_reset_pct = 3.0       # 30m 内 OI 降幅阈值 → 当日观望

[strategy.plugins.LargeTradeFlow]
size_large_usd = 200_000
window_secs = 10
surge_mult = 5.0

[strategy.plugins.ExhaustionReversal]
# renko 砖参数（Exocharts Trend Reversal 200-124，BTC 永续调教值）
tick_usd = 0.5
t_ren_ticks = 200        # 同向 50 美元/砖
r_ren_ticks = 62        # 反向 31 美元出反转砖
# 三条件
vol_mult_exh = 3.0       # 放量倍数（×时段系数）
dur_max_ms = 10000      # 快速上限（秒/砖）
prog_ratio = 0.4
trapped_min_btc = 50.0   # 针尖被套加分项（非必要）
# 时段系数（周末/亚盘/美盘流动性差异，校准重点）
session_scaler = { asia = 1.0, europe = 1.0, us = 0.8, weekend = 0.6 }

delta_flip_pct = 8.0         # 下限（≥8% 才算翻向）
delta_flip_max_pct = 50.0    # 上限（>50% 是恐慌棒，非力竭，不碰）
dur_max_secs = 10
cooldown_bricks = 15          # 扣扳机后 5 块砖内不再扣（绞肉机过滤）

[strategy.plugins.BreakevenAt300]
trigger_usd = 300        # 离开入场价 300 美元推保本（教程统计90%不亏）

[strategy.plugins.TieredTakeProfit]
tp1_pct = 50             # TP1 平仓比例