[runtime]
# proxy = "http://127.0.0.1:7890"
binance_futures_ws_base = "wss://fstream.binance.com"
poll_seconds = 15
stream_warmup_seconds = 5
oi_refresh_seconds = 120
slow_market_refresh_seconds = 60
journal_path = "data/runtime/demo-events.jsonl"
history_path = "data/runtime/demo-history.jsonl"
status_path = "data/runtime/demo-status.json"
execution_state_path = "data/runtime/binance-demo-state.json"

[portfolio]
initial_equity_usd = 3000.0
max_positions = 7

[backtest]
fee_bps_per_side = 5.0
slippage_bps_per_side = 5.0

[execution]
mode = "binance_demo"
base_url = "https://demo-fapi.binance.com"
api_key_env = "BINANCE_DEMO_API_KEY"
api_secret_env = "BINANCE_DEMO_API_SECRET"
recv_window_ms = 5000

[strategy]
majors = ["BTCUSDT", "ETHUSDT"]
altcoins = [
  "BNBUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "LINKUSDT",
  "AVAXUSDT", "SUIUSDT", "LTCUSDT", "BCHUSDT", "TRXUSDT", "DOTUSDT",
]

[strategy.universe]
dynamic_enabled = true
max_altcoins = 30
top_liquidity_names = 12
top_mover_names = 18
min_24h_quote_volume_usd = 25000000.0
refresh_minutes = 1
anomaly_scan_seconds = 15

[strategy.primitives]
trend_horizon_bars = 96
trend_min_return_pct = 0.008
trend_min_efficiency = 0.20
breadth_horizon_bars = 32
breadth_threshold = 0.008
breadth_min_participation = 0.60
regime_volatility_window_bars = 32
regime_shock_volatility_ratio = 1.80

[strategy.recipes]
alt_cross_section_enabled = false
alt_early_impulse_enabled = true
alt_outlier_momentum_enabled = true
alt_shock_reversal_enabled = true
cross_names = 1
cross_rebalance_bars = 4
cross_opportunity_driven = true
alt_neutral_anchor_allowed = true
alt_shock_neutral_anchor_allowed = false
outlier_names = 3
outlier_min_return_1h_pct = 0.020
outlier_min_return_4h_pct = 0.045
outlier_min_volume_ratio = 1.50
outlier_min_efficiency = 0.45
outlier_confirmation_min_5m_pct = 0.001
outlier_confirmation_max_5m_pct = 0.012
outlier_max_directional_wick_ratio = 0.35
outlier_max_climax_range_ratio = 2.8
outlier_pullback_min_pct = 0.004
outlier_pullback_max_pct = 0.015
outlier_candidate_expiry_minutes = 10
outlier_short_threshold_multiplier = 1.25
impulse_names = 2
impulse_min_15m_pct = 0.006
impulse_max_15m_pct = 0.025
impulse_min_volume_ratio = 1.60
impulse_max_1h_pct = 0.040
impulse_min_return_z = 1.8
impulse_pullback_min_fraction = 0.15
impulse_pullback_max_fraction = 0.60
impulse_short_threshold_multiplier = 1.30
pullback_min_pct = 0.003
exhaustion_move_pct = 0.024
shock_min_return_pct = 0.060
shock_min_reversal_pct = 0.008
shock_min_volume_ratio = 3.0

[strategy.risk]
# 3000 USDT: majors 1500 + altcoins 1500. The attack sleeve values below are explicit.
major_short_size_multiplier = 0.35
major_max_gross = 0.50
alt_max_gross = 0.50
alt_neutral_anchor_size_multiplier = 0.30
alt_neutral_anchor_stop_pct = 0.012
alt_neutral_anchor_take_profit_pct = 0.018
alt_neutral_anchor_max_hold_minutes = 240
alt_outlier_gross_per_trade = 0.02
alt_intraday_gross_per_trade = 0.08
alt_intraday_stop_pct = 0.009
alt_intraday_max_hold_minutes = 90
alt_outlier_opposed_size_multiplier = 0.50
alt_outlier_neutral_size_multiplier = 0.75
alt_outlier_breadth_opposed_size_multiplier = 0.35
alt_outlier_breadth_neutral_size_multiplier = 0.65
alt_shock_regime_size_multiplier = 0.50
alt_outlier_stop_pct = 0.012
alt_outlier_take_profit_pct = 0.020
alt_outlier_max_hold_minutes = 120
alt_cross_stop_pct = 0.012
alt_cross_take_profit_pct = 0.025
alt_cross_max_hold_minutes = 180
risk_shield_r_multiple = 0.75
risk_shield_fraction = 0.25
second_take_profit_r_multiple = 1.0
second_take_profit_fraction = 0.30
runner_take_profit_r_multiple = 2.5
break_even_cost_buffer_pct = 0.0015
rolling_pf_window = 10
rolling_pf_min_trades = 3
rolling_pf_floor = 1.00
rolling_pf_cooldown_minutes = 720
rolling_pf_probe_size_multiplier = 0.70
rolling_pf_epoch = 2
