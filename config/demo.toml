[runtime]
# proxy = "http://127.0.0.1:7890"
binance_futures_ws_base = "wss://fstream.binance.com"
# Strategy frames remain on a five-second cadence. Position reconciliation and
# executable-profit protection run independently every 500 ms.
poll_seconds = 5
execution_sync_millis = 500
stream_warmup_seconds = 20
request_spacing_ms = 150
request_timeout_seconds = 8
# Keep a long rolling candle window for research capture and indicator warmup.
candle_limit = 1200
journal_path = "data/runtime/alpha-events.jsonl"
history_path = "data/runtime/alpha-history.jsonl"
# Compact research samples live outside the verbose strategy journal so market
# history survives long enough for walk-forward alpha research. Nine bounded
# 256 MiB files cap disk use at roughly 2.25 GiB without touching trade/PnL data.
research_enabled = true
research_path = "data/research/market-research.jsonl"
research_snapshot_seconds = 15
research_level_map_seconds = 60
# Per-symbol research context: 6h at 1m, 2d at 5m, 12.5d at 15m and 30d at 1h.
research_backfill_1m_bars = 360
research_backfill_5m_bars = 576
research_backfill_15m_bars = 1200
research_backfill_1h_bars = 720
research_file_max_mb = 256
research_rotations = 8
status_path = "data/runtime/alpha-status.json"
execution_state_path = "data/runtime/binance-alpha-state.json"
http_listen = "127.0.0.1:8088"

[portfolio]
initial_equity_usd = 10000.0
max_positions = 3

[execution]
mode = "binance_demo"
base_url = "https://demo-fapi.binance.com"
api_key_env = "BINANCE_DEMO_API_KEY"
api_secret_env = "BINANCE_DEMO_API_SECRET"
recv_window_ms = 5000
leverage = 5
# Fresh execution-venue depth only; exchange-hosted hard stops remain active.
executable_profit_guard = true

[strategy]
# Always subscribed and retained; dynamic discovery fills the remaining slots.
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]

[strategy.universe]
dynamic_enabled = true
# Match the 46-contract research universe. Incremental websocket subscriptions
# keep retained books live when the ranked membership changes.
max_symbols = 46
top_liquidity_names = 26
top_mover_names = 20
min_24h_quote_volume_usd = 15000000.0
# A thin contract may join on either a fresh 15m impulse or an established 24h
# move. Requiring both made early movers invisible until the first leg was over.
# This only grants data coverage; signal and plan-level liquidity gates remain.
surge_min_24h_quote_volume_usd = 2000000.0
surge_min_abs_change_24h = 0.08
surge_min_abs_return_15m = 0.015
refresh_seconds = 15

[strategy.lanes]
max_candidates_per_lane = 2
max_spread_bps = 6.0
# Separate paper-only offensive lane. It enters before the slower 4h trend
# recipe, but only after a completed 5m ignition, a 1m retest, broad altcoin
# participation and moderate (not crowded) open-interest growth.
fast_activation_enabled = true
fast_min_market_return_1h = 0.002
fast_min_market_breadth = 0.50
fast_min_body_return_5m = 0.005
fast_min_volume_ratio_5m = 2.0
fast_min_flow_5m = 0.15
fast_max_compression_ratio = 1.05
# A second mutually-exclusive entry shape handles a fresh acceleration inside
# an existing trend. It must be materially stronger than the compressed
# breakout, so this is not a blanket relaxation of the original gate.
fast_reacceleration_enabled = true
fast_reacceleration_max_compression_ratio = 3.0
fast_reacceleration_min_body_return_5m = 0.0075
fast_reacceleration_min_volume_ratio_5m = 4.0
fast_reacceleration_min_flow_5m = 0.25
# A reacceleration may cross immediately only while the broad tape confirms
# it and the combined pre-break + ignition extension is still under 2.5%.
# Otherwise it must print a real one-minute touch-and-reclaim first.
fast_reacceleration_direct_min_market_breadth = 0.60
fast_reacceleration_direct_min_market_return_1h = 0.002
fast_reacceleration_direct_max_extension = 0.025
fast_reacceleration_direct_early_extension = 0.015
# Stay early without demanding a perfectly flat pre-break hour. 4USDT on
# 2026-09-05 began its persistent leg with +2.9% pre-break, +5.2% over 4h and
# +2.3% OI over 15m, then supplied the required 1m reclaim.
fast_max_prebreak_return_1h = 0.03
fast_max_return_4h = 0.06
fast_max_oi_change_15m = 0.03
fast_risk_per_trade_pct = 0.005
fast_min_fill_ratio = 0.80
fast_min_managed_fill_ratio = 0.20
# Frozen paper-validation lane: fade a three-second one-sided liquidation
# cascade only after the price has moved with the forced flow. It is evaluated
# from Binance public force-order and top-20 depth streams, enters through a
# bounded IOC after at least one second. A 2% exchange-side stop covers the
# catastrophe case. Paper validation enables the managed lifecycle: protect
# 22 bps after a 45 bps move, trail by 50 bps from 90 bps, exit by 15 minutes.
# The wider lifecycle retained the same entries while improving both the
# earlier calibration days and the later validation days in executable-book
# replay; the 2% catastrophe stop and all admission gates remain unchanged.
liquidation_reversal_enabled = true
liquidation_window_seconds = 3
liquidation_min_dominance = 0.80
liquidation_min_depth_ratio = 1.20
liquidation_min_aligned_return_bps = 3.0
liquidation_min_reversal_bps = 12.0
liquidation_min_entry_delay_seconds = 1
liquidation_max_signal_age_seconds = 12
liquidation_cooldown_seconds = 30
liquidation_stop_pct = 0.020
liquidation_hold_minutes = 15
# Enabled for Binance Demo; existing positions retain persisted exit settings.
liquidation_managed_exit_enabled = true
liquidation_profit_shield_activation_bps = 45.0
liquidation_profit_shield_floor_bps = 22.0
liquidation_trailing_activation_bps = 90.0
liquidation_trailing_distance_bps = 50.0
# Keep this higher-frequency lane at probe risk until the larger sample confirms
# the lifecycle replay without letting it dominate the trend lane.
liquidation_risk_per_trade_pct = 0.0025
# Mainnet produces the signal while Binance Demo executes it. Refuse the
# trade when the Demo top-of-book differs by more than 15 bps, and use an IOC
# limit so an accepted order cannot slip through that boundary.
liquidation_max_execution_divergence_bps = 15.0
trend_min_return_4h = 0.025
trend_min_efficiency = 0.45
trend_min_hour_volume_ratio = 0.65
trend_min_flow_imbalance = 0.0
# A qualifying 4h trend is actionable only during its first two completed 15m bars.
# Later pullbacks belong to a mature move and must not be presented as fresh.
trend_max_age_bars = 2
# A pullback reclaim must still be a pullback. Oversized displacement candles
# are handled by the fast lane instead of being chased by trend continuation.
trend_max_extension_atr = 3.5
trend_max_reclaim_body_atr = 2.5
trend_max_signal_age_seconds = 300
# Start 0.03 ATR behind the completed reclaim, then move the post-only order
# toward the live passive book every 15 seconds while the signal is still fresh.
trend_limit_offset_atr = 0.03
trend_entry_timeout_seconds = 90
# Reprice the passive maker order toward the live book, but never chase farther
# than this distance beyond the signal reference price.
trend_max_entry_adverse_bps = 8.0
# A timeout with no fill is skipped. Incidental fills below 80% of the planned
# Stop waiting for the remainder at 80%. At expiry, a smaller fill may still
# be managed from 20% upward when every protective exit passes exchange rules.
trend_min_fill_ratio = 0.80
trend_min_managed_fill_ratio = 0.20
# A pullback that trades more than 30 bps through our intended maker limit is
# no longer a retest. Cancel it immediately instead of filling a rebound after
# the live signal has already failed.
trend_entry_invalidation_bps = 30.0
# Do not chase a continuation after price has already run away from the
# completed 15m reclaim. This avoided the late STX loss in the 2026-08-27
# Demo counterfactual while preserving the profitable CYS entry.
trend_max_post_signal_extension_bps = 12.0
# A passive order is also stale when price has already travelled far in the
# intended direction: it can then fill only after a sharp reversal back toward
# the signal. The 30 bps cap removes this observed adverse-selection pattern.
trend_max_post_signal_favorable_bps = 30.0
# Veto only when live trade flow and the 10s price response both strongly
# oppose the completed 15m signal.
trend_max_opposing_micro_flow = 0.10
trend_max_opposing_micro_return_bps = 3.0
# Offensive paper setting: risk 1.5% of strategy equity at the initial stop.
# On a 5,000 USDT account with the default 1.25% stop, planned notional is
# about $6,000 and the full-stop loss is about $75 before gap/slippage.
trend_risk_per_trade_pct = 0.015
# Keep the entire position when price first proves the trade. At +0.32R
# (about +0.40% with the 1.25% stop), move the exchange-side stop to at least
# +0.15% above entry. Thin books raise that floor only enough to cover stressed
# expected exit impact, round-trip fees, and a 2 bps net margin (capped +0.30%).
trend_profit_shield_activation_r = 0.32
trend_profit_shield_buffer_pct = 0.0015
# Do not tighten the peak-following trail until +1R. Before then the fixed
# profit shield protects the trade while leaving the full position exposed.
trend_pre_tp_trailing_activation_r = 1.0
# Below the +0.32R profit-shield handoff, a continuation that reaches -0.5R
# after one minute has failed; flatten it rather than waiting for -1R.
trend_early_failure_seconds = 60
# A large fresh impulse with non-opposing live flow gets one completed
# three-minute retest window. Ordinary or opposing-flow entries keep the fast
# 60-second failure cap.
trend_early_failure_grace_seconds = 180
trend_early_failure_grace_min_body_atr = 2.0
trend_early_failure_adverse_r = 0.50
trend_early_failure_max_mfe_r = 0.32
# A profitable shield exit keeps one continuation campaign alive. Price must
# first reset 0.6% from the first-leg extreme, then a completed 5m candle must
# resume through the prior two bars with a 0.2% body and 5% directional taker
# imbalance. One re-entry is allowed for three hours; loss exits never arm it.
trend_reentry_enabled = true
trend_reentry_window_minutes = 180
trend_reentry_reset_pct = 0.006
trend_reentry_lookback_bars = 2
trend_reentry_min_body_pct = 0.002
trend_reentry_min_flow = 0.05
trend_reentry_min_stop_pct = 0.003
trend_reentry_max_stop_pct = 0.0125
# The second leg arms profit protection at 0.8%, starts continuous trailing at
# 1.0%, and then locks the executable peak less a 0.5% giveback.
trend_reentry_profit_shield_pct = 0.008
trend_reentry_trailing_activation_pct = 0.010
trend_reentry_trailing_distance_pct = 0.005
trend_reentry_entry_timeout_seconds = 30
[strategy.risk]
risk_per_trade_pct = 0.010
high_confidence_risk_per_trade_pct = 0.010
high_confidence_threshold = 0.85
max_notional_per_trade_multiple = 1.50
max_total_gross_multiple = 4.00
# Size against the actual protective-exit side of the live top-20 book. Orders
# may shrink, but may not consume more than 35% of visible depth or simulate
# more than 8 bps of VWAP impact. A valid signal may scale to 15% of desired
# size, but never below 10% of equity; this keeps thin books from blocking the
# entire trend lane while refusing economically meaningless dust positions.
max_book_participation_pct = 0.35
max_book_slippage_bps = 8.0
min_liquidity_size_ratio = 0.15
min_liquidity_notional_multiple = 0.10
max_positions = 3
initial_stop_pct = 0.0125
first_take_profit_r = 2.0
first_take_profit_fraction = 0.40
runner_take_profit_r = 0.0
break_even_buffer_pct = 0.0018
# Protect estimated round-trip costs once price reaches +0.5R. At +0.8R the
# full position begins trailing; the first 40% still exits at 2R and the
# remaining runner keeps the same trailing protection.
profit_shield_activation_r = 0.50
# Once open profit reaches 0.8R, trail the full position by 0.5%. This locks a
# meaningful pre-TP1 gain without moving the stop during an ordinary early pullback.
pre_tp_trailing_activation_r = 0.80
trailing_distance_pct = 0.005
# Zero disables time-based exits. Hard stop, cost shield, and trailing protection remain exchange-side.
max_hold_minutes = 0
daily_loss_limit_pct = 0.025
peak_drawdown_halt_pct = 0.10
rolling_pf_window = 20
rolling_pf_min_trades = 8
rolling_pf_floor = 1.00
rolling_pf_cooldown_minutes = 360
loss_cooldown_minutes = 180
rolling_pf_probe_size_multiplier = 1.00
# Epoch 19 starts a clean $10,000 virtual performance window. Historical journals
# remain on disk; only the live baseline and adaptive performance gates reset.
rolling_pf_epoch = 19
