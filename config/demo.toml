[runtime]
# proxy = "http://127.0.0.1:7890"
binance_futures_ws_base = "wss://fstream.binance.com"
# Reconcile Binance account/position state every five seconds. Market discovery
# remains independently capped by strategy.universe.refresh_seconds.
poll_seconds = 5
stream_warmup_seconds = 20
request_spacing_ms = 150
request_timeout_seconds = 8
# 1,200 x 15m bars provide the 12-day structural history required by SFP.
candle_limit = 1200
journal_path = "data/runtime/alpha-events.jsonl"
history_path = "data/runtime/alpha-history.jsonl"
status_path = "data/runtime/alpha-status.json"
execution_state_path = "data/runtime/binance-alpha-state.json"
http_listen = "127.0.0.1:8088"

[portfolio]
initial_equity_usd = 2000.0
max_positions = 3

[execution]
mode = "binance_demo"
base_url = "https://demo-fapi.binance.com"
api_key_env = "BINANCE_DEMO_API_KEY"
api_secret_env = "BINANCE_DEMO_API_SECRET"
recv_window_ms = 5000
leverage = 5

[strategy]
# Always subscribed and retained; dynamic discovery fills the remaining slots.
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT"]

[strategy.universe]
dynamic_enabled = true
# Match the 46-contract research universe. Incremental websocket subscriptions
# keep retained books live when the ranked membership changes.
max_symbols = 46
top_liquidity_names = 26
top_mover_names = 20
min_24h_quote_volume_usd = 25000000.0
refresh_seconds = 15

[strategy.lanes]
sfp_reversal_enabled = true
trend_continuation_enabled = true
ignition_sprint_enabled = false
relative_weakness_short_enabled = true
max_candidates_per_lane = 2
max_spread_bps = 6.0
# Ten times the standard 2,000 USDT trend notional; spread remains capped at 6 bps.
min_depth_usd = 20000.0
sfp_lookback_hours = 288
sfp_min_sweep_atr = 0.10
sfp_max_sweep_atr = 1.25
sfp_min_volume_ratio = 1.0
sfp_confirmation_hours = 3
sfp_max_signal_age_seconds = 300
sfp_target_r = 2.0
sfp_max_hold_minutes = 180
sfp_risk_per_trade_pct = 0.0025
trend_min_return_4h = 0.06
trend_min_efficiency = 0.45
trend_min_hour_volume_ratio = 0.65
trend_min_flow_imbalance = 0.0
# A 6% / 4h trend is actionable only during its first two completed 15m bars.
# Later pullbacks belong to a mature move and must not be presented as fresh.
trend_max_age_bars = 2
trend_max_signal_age_seconds = 300
# Start 0.30 ATR behind the completed reclaim, then move the post-only order
# toward the live passive book every 15 seconds while the signal is still fresh.
trend_limit_offset_atr = 0.30
trend_entry_timeout_seconds = 60
# Reprice the passive maker order toward the live book, but never chase farther
# than this distance beyond the signal reference price.
trend_max_entry_adverse_bps = 8.0
# If the full-size maker order never fills, take only a 5% probe when the
# executable price remains within 20 bps of the original signal. Walk-forward
# tests rejected both full-size fallback and wider/unbounded chasing.
trend_taker_fallback_max_adverse_bps = 20.0
trend_taker_fallback_size_multiplier = 0.05
# Do not chase a continuation after price has already run away from the
# completed 15m reclaim. This avoided the late STX loss in the 2026-08-27
# Demo counterfactual while preserving the profitable CYS entry.
trend_max_post_signal_extension_bps = 12.0
# Veto only when live trade flow and the 10s price response both strongly
# oppose the completed 15m signal.
trend_max_opposing_micro_flow = 0.15
trend_max_opposing_micro_return_bps = 3.0
# Tactical short: underperform BTC, break the prior 1h low with sell flow, and
# exit within 30 minutes. Selected on train/validation; locked and recent were
# positive after conservative 8 bps per-side execution costs.
weakness_max_relative_1h = -0.005
weakness_max_relative_4h = -0.010
weakness_max_flow = -0.05
weakness_min_hour_volume_ratio = 0.80
weakness_breakdown_bars = 4
weakness_max_signal_age_seconds = 120
weakness_target_r = 0.75
weakness_max_hold_minutes = 30
weakness_risk_per_trade_pct = 0.0015
weakness_max_notional_multiple = 1.0
ignition_min_return_5m = 0.010
ignition_min_volume_ratio = 3.0
ignition_min_flow_imbalance = 0.20
ignition_reclaim_flow_imbalance = 0.10
ignition_max_extension_30m = 0.03
ignition_max_wait_seconds = 180
ignition_limit_offset_atr = 0.05
# The walk-forward models two subsequent one-minute bars for the passive touch.
ignition_entry_timeout_seconds = 120
ignition_stop_atr_multiple = 1.0
ignition_target_r = 1.25
ignition_max_hold_minutes = 10
ignition_risk_per_trade_pct = 0.0025

[strategy.risk]
risk_per_trade_pct = 0.010
high_confidence_risk_per_trade_pct = 0.010
high_confidence_threshold = 0.85
max_notional_per_trade_multiple = 1.50
max_total_gross_multiple = 4.00
max_positions = 3
initial_stop_pct = 0.0125
first_take_profit_r = 2.0
first_take_profit_fraction = 0.40
runner_take_profit_r = 0.0
break_even_buffer_pct = 0.0018
# Protect estimated round-trip costs once price reaches +0.5R. At +0.8R the
# full position begins trailing; the first 40% still exits at 2R and the
# remaining runner keeps the same trailing protection.
profit_shield_activation_r = 0.50
# Once open profit reaches 0.8R, trail the full position by 0.5%. This locks a
# meaningful pre-TP1 gain without moving the stop during an ordinary early pullback.
pre_tp_trailing_activation_r = 0.80
trailing_distance_pct = 0.005
# Zero disables time-based exits. Hard stop, cost shield, and trailing protection remain exchange-side.
max_hold_minutes = 0
daily_loss_limit_pct = 0.025
peak_drawdown_halt_pct = 0.10
rolling_pf_window = 20
rolling_pf_min_trades = 8
rolling_pf_floor = 1.00
rolling_pf_cooldown_minutes = 360
loss_cooldown_minutes = 180
rolling_pf_probe_size_multiplier = 1.00
# Keep the current paper run and rolling PF history continuous while execution
# mechanics are improved; changing this value intentionally starts a new gate window.
rolling_pf_epoch = 13
