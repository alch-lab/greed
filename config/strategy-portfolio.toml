# 单账户双策略组合：同一 Binance Futures 模拟账户，共享执行账户但使用两套
# 独立虚拟账本、持仓归属、回撤统计、Journal 与收益曲线。

[portfolio]
enabled = true
allow_live = true
mr_strategy = "config/strategy-final.toml"
altcoin_strategy = "config/strategy-altcoin-impulse.toml"
mr_capital_usdt = 1500.0
altcoin_capital_usdt = 1500.0
# BTC 使用 0.25% 初始保护距离：0.75% 风险预算对应约 3x 权益名义仓位。
# 完整初始止损约 $11.25，另加成交费用与滑点；两次完整亏损接近日熔断线。
mr_risk_pct = 0.0075
mr_max_risk_pct = 0.0075
mr_leverage = 3
# BTC sleeve 连续 2 笔亏损或北京时间日内权益回撤 2% 时，立即全平并锁死新仓。
mr_cb_max_daily_losses = 2
mr_cb_daily_dd_pct = 0.02
